<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#23262e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <title>Anmol Airi - AI Engineer & Backend Developer</title>
    <meta name="description" content="Anmol Airi - CSE graduate (MAIT '26) building LLM applications, RAG pipelines, and backend services in Python/FastAPI. National-level athlete. 616+ LeetCode problems solved." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Sora:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      html, body { margin: 0; background: #23262e; }
      body.is-booting { overflow: hidden; height: 100%; }
      #boot-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: grid; place-items: center;
        background:
          radial-gradient(ellipse 70% 50% at 50% 40%, rgba(233, 172, 63, 0.08), transparent 60%),
          #23262e;
        color: #e6e8ec;
        font-family: 'Space Mono', ui-monospace, monospace;
        transition: opacity 0.55s ease, visibility 0.55s ease;
      }
      #boot-splash.is-done { opacity: 0; visibility: hidden; pointer-events: none; }
      #boot-splash .boot-panel { text-align: center; padding: 1.5rem; max-width: 22rem; }
      #boot-splash .boot-brand {
        font-size: 0.68rem; letter-spacing: 0.28em; text-transform: uppercase;
        color: #e9ac3f; margin: 0 0 1.25rem;
      }
      #boot-splash .boot-title {
        font-family: 'Space Grotesk', system-ui, sans-serif;
        font-size: clamp(1.6rem, 5vw, 2.1rem); font-weight: 700;
        letter-spacing: -0.03em; margin: 0 0 0.65rem; color: #fff;
      }
      #boot-splash .boot-sub {
        font-size: 0.72rem; letter-spacing: 0.08em; color: rgba(209, 213, 219, 0.65);
        margin: 0 0 1.75rem;
      }
      #boot-splash .boot-bar {
        height: 3px; border-radius: 999px; overflow: hidden;
        background: rgba(255,255,255,0.08);
      }
      #boot-splash .boot-bar > span {
        display: block; height: 100%; width: 18%;
        background: linear-gradient(90deg, #c48a2a, #e9ac3f);
        animation: bootPulse 1.1s ease-in-out infinite;
      }
      @keyframes bootPulse {
        0% { width: 12%; opacity: 0.7; }
        50% { width: 72%; opacity: 1; }
        100% { width: 28%; opacity: 0.8; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-bar > span { animation: none; width: 55%; }
      }
    </style>
  </head>
  <body class="is-booting">
    <div id="boot-splash" role="status" aria-live="polite" aria-busy="true">
      <div class="boot-panel">
        <p class="boot-brand">ANMOL / BOOT</p>
        <h1 class="boot-title">Loading systems</h1>
        <p class="boot-sub">Fonts · scene · interfaces</p>
        <div class="boot-bar" aria-hidden="true"><span></span></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
